<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if title %}{{ title }} | Sango Fiora{% else %}Sango Fiora — Premium Artificial Plants & Trees Online{% endif %}</title>
  <meta name="description" content="{% if description %}{{ description }}{% else %}Buy premium artificial plants & trees online in India. Lifelike foliage, palms, indoor trees & flowering plants with decorative pots included.{% endif %}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪴</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="bg-background text-on-background antialiased flex flex-col min-h-screen">
  {% include 'partials/header.html' %}

  <div class="flex-1">
    {{ content | safe }}
  </div>

  {% include 'partials/footer.html' %}

  <!-- Supabase CDN -->

  <!-- Global Application Scripts -->
  <script>window.SANGO_PRODUCTS = {{ plants.products | json | safe }};</script>
  <script src="/js/event-bus.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/supabase-auth.js"></script>
  <script src="/js/wishlist.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/checkout.js"></script>
  <script src="/js/orders-tracker.js"></script>
  <script src="/js/catalog.js"></script>
  <script src="/js/inquiry.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
