<article class="product-card group bg-white rounded-2xl overflow-hidden border border-outline-variant/30 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col relative"
  data-category="{{ p.category }}" data-price="{{ p.price }}" data-rating="{{ p.rating }}" data-discount="{{ p.discount }}" data-name="{{ p.name }}">
  
  <a href="/products/{{ p.slug }}/" class="relative block aspect-square overflow-hidden bg-surface-container">
    <img src="{{ p.image }}" alt="{{ p.name }}" {% if isAboveFold %}decoding="async" fetchpriority="high"{% else %}loading="lazy" decoding="async"{% endif %} width="300" height="300"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
    {% if p.discount %}
    <span class="absolute top-3 left-3 bg-red-600 text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full shadow-sm">SAVE {{ p.discount }}%</span>
    {% endif %}
  </a>

  <!-- Heart Wishlist Toggle Button -->
  <button type="button" aria-label="Add {{ p.name }} to wishlist"
    data-wishlist-btn data-slug="{{ p.slug }}" data-name="{{ p.name }}" data-category="{{ p.category }}"
    data-size="{{ p.size }}" data-price="{{ p.price }}" data-mrp="{{ p.mrp }}" data-image="{{ p.image }}"
    class="absolute top-3 right-3 w-8 h-8 rounded-full bg-white/90 backdrop-blur border border-outline-variant/30 flex items-center justify-center text-gray-400 hover:text-red-500 transition-colors shadow-sm z-10">
    <span class="material-symbols-outlined text-sm">favorite</span>
  </button>

  <div class="p-4 flex flex-col flex-1">
    <p class="text-[11px] font-semibold text-deep-forest/80 uppercase tracking-wider mb-1">{{ p.category }} · {{ p.size }}</p>
    <a href="/products/{{ p.slug }}/" class="font-headline-sm font-bold text-gray-900 leading-snug hover:text-deep-forest transition-colors text-sm line-clamp-1">{{ p.name }}</a>
    
    <div class="flex items-center gap-1 mt-1.5" aria-label="Rated {{ p.rating }} out of 5">
      <span class="text-amber-gold text-xs">★★★★★</span>
      <span class="text-[11px] text-on-surface-variant font-medium">{{ p.rating }} ({{ p.reviews }})</span>
    </div>

    <div class="mt-auto pt-3 flex items-end justify-between gap-2">
      <div>
        <span class="text-base font-bold text-deep-forest">₹{{ p.price }}</span>
        {% if p.mrp > p.price %}<span class="ml-1 text-xs text-gray-400 line-through">₹{{ p.mrp }}</span>{% endif %}
      </div>

      <button type="button" aria-label="Add {{ p.name }} to cart"
        data-add-to-cart data-slug="{{ p.slug }}" data-name="{{ p.name }}" data-variant="{{ p.variant }}"
        data-category="{{ p.category }}" data-size="{{ p.size }}" data-price="{{ p.price }}"
        data-mrp="{{ p.mrp }}" data-image="{{ p.image }}"
        class="bg-amber-gold hover:bg-amber-400 text-deep-forest text-xs font-bold px-3.5 py-1.5 rounded-full transition-colors shrink-0 shadow-sm">
        Add +
      </button>
    </div>
  </div>
</article>
